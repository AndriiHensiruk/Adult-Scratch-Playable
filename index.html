<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adult Scratch Playable</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        #game-container {
            position: relative;
            width: min(100vw, calc(100vh * 9 / 16));
            height: min(100vh, calc(100vw * 16 / 9));
            background-color: #000;
            overflow: hidden;
            flex-shrink: 0;
        }

        #splash-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            cursor: pointer;
            background: transparent;
        }

        #video-overlay-img {
            position: absolute;
            top: 15%;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            pointer-events: none;
            opacity: 1;
        }

        #girl-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: blur(15px);
            transition: filter 0.3s ease;
        }

        #game-header {
            position: absolute;
            top: 35%;
            left: 5%;
            width: 90%;
            z-index: 5;
            pointer-events: none;
        }

        #scratch-zone {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95%;
            height: 20%;
            z-index: 10;
        }

        .status-text-png {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            object-fit: contain;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        #scratch-to-claim-png {
            height: 28%;
            width: auto;
            z-index: 11;
            display: none;
            opacity: 1;
        }

        #tap-to-start-png {
            position: absolute;
            top: 12%;
            left: 35%;
            transform: translate(-50%, -50%);
            width: 30%;
            height: auto;
            z-index: 15;
            pointer-events: none;
            animation: pulse 1.5s infinite;
            object-fit: contain;
        }

        #scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 12;
            transition: opacity 0.4s ease;
            cursor: crosshair;
        }

        #hand-pointer {
            position: absolute;
            top: 64%;
            left: 45%;
            width: 20.5%;  
            min-width: 40px;
            max-width: 80px;
            z-index: 20;
            pointer-events: none;
            transform-origin: top left;
            animation: scratchAndTap 1.6s infinite ease-in-out;
        }

        @keyframes scratchAndTap {
            0%, 100% { transform: translateY(90%) translateX(0) scale(1) rotate(0deg); }
            25%       { transform: translateY(35%) translateX(6px) scale(0.9) rotate(5deg); }
            50%       { transform: translateY(50%) translateX(0) scale(1) rotate(0deg); }
            75%       { transform: translateY(95%) translateX(4px) scale(0.9) rotate(0deg); }
        }

        /* Feather  */
        #feather-container {
            position: absolute;
            top: 89%;
            left: 50%;
            transform: translate(-50%, -80%);
            z-index: 22;
            display: none;
            pointer-events: none;
            flex-direction: column;
            align-items: center;
            will-change: left, top;
        }

        #feather {
            width: 65%;
            transform-origin: bottom center;
        }

        .feather-idle-animation {
            animation: featherIdle 2.5s infinite ease-in-out;
        }

        @keyframes featherIdle {
            0%, 100% { transform: rotate(-5deg) translateY(0); }
            50%       { transform: rotate(10deg) translateY(-8px); }
        }

        .feather-drawing-animation {
            animation: featherDrawShake 0.15s infinite linear;
        }

        @keyframes featherDrawShake {
            0%, 100% { transform: rotate(-12deg) translate(0, 0); }
            50%       { transform: rotate(-8deg) translate(2px, -1px); }
        }

        #end-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 20%;
            background: rgba(0, 0, 0, 0.55);
        }

        #win-bubble {
            width: 85%;
            animation: bubblePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 5px;
        }

        @keyframes bubblePop {
            0%   { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #cta-link {
            width: 70%;
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        #cta-button {
            width: 100%;
            cursor: pointer;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%       { transform: scale(1.05); }
        }

        #timer {
            color: #fff;
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(0.7rem, 2.5%, 1.1rem);
            font-weight: bold;
            text-shadow: 1px 1px 3px #000;
            white-space: nowrap;
            width: max-content;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 45;
        }

        #music-toggle {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 110;
            width: clamp(32px, 5%, 44px);
            height: clamp(32px, 5%, 44px);
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        #music-toggle:active {
            transform: scale(0.88);
            background: rgba(0, 0, 0, 0.65);
        }

        #music-toggle:hover {
            background: rgba(0, 0, 0, 0.65);
        }

        #music-toggle svg {
            width: 20px;
            height: 20px;
            fill: #fff;
            display: block;
            transition: opacity 0.2s ease;
        }

        #music-toggle.muted svg {
            opacity: 0.45;
        }


        #desktop-hint {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            align-items: center;
            justify-content: space-between;
        }

        .side-hint {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.12);
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            writing-mode: vertical-rl;
            padding: 0 8px;
        }

        @media (min-width: 600px) and (min-aspect-ratio: 9/16) {
            /* Показуємо підказку тільки якщо є місце збоку */
            #desktop-hint { display: flex; }
        }
    </style>
</head>
<body>

    <!-- Декоративні бічні підписи на широких екранах -->
    <div id="desktop-hint" aria-hidden="true">
        <span class="side-hint">Scratch &amp; Win</span>
        <span class="side-hint">Scratch &amp; Win</span>
    </div>

    <div id="game-container">
        <div id="splash-trigger"></div>

        <video id="girl-video" src="assets/girl.mp4" preload="auto" loop muted playsinline></video>
        <img id="video-overlay-img" src="assets/duarBlur.png" alt="Overlay">
        <img id="game-header" src="assets/header_title.png" alt="Header">

        <div id="scratch-zone">
            <img id="scratch-to-claim-png" class="status-text-png" src="assets/scratch_to_claim.png" alt="Scratch to Claim">
            <img id="tap-to-start-png" src="assets/tap_to_start.png" alt="Tap To Start">
            <canvas id="scratch-canvas"></canvas>
        </div>

        <img id="hand-pointer" src="assets/hand_pointer.png" alt="Pointer Hand">

        <div id="feather-container">
            <img id="feather" class="feather-idle-animation" src="assets/feather.png" alt="feather">
        </div>

        <div id="end-card">
            <img id="win-bubble" src="assets/win_bubble.png" alt="Win Action">
            <a id="cta-link" href="https://first-link.com" target="_self">
                <img id="cta-button" src="assets/btn_read_now.png" alt="Action Button">
            </a>
            <div id="timer">Access expires in 00:59s</div>
        </div>

        <canvas id="particle-canvas"></canvas>

        <button id="music-toggle" aria-label="Toggle music">
            <svg id="icon-sound-on" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg id="icon-sound-off" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none;">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
        </button>
    </div>

    <audio id="bg-sound"     src="assets/breathing.mp3" loop preload="auto"></audio>
    <audio id="bg-music"     src="assets/music.mp3"     loop preload="auto"></audio>
    <audio id="scratch-sound" src="assets/scratch.mp3"  loop preload="auto"></audio>
    <audio id="win-sound"    src="assets/win.mp3"        preload="auto"></audio>

    <script>
        const config = {
            requiredPercent : 45,
            brushSize       : 20,
            timerDuration   : 59,
            videoSpeed      : 0.5,
            musicVolume     : 0.15,
            scratchVolume   : 0.4,
            winVolume       : 0.8,
            btnImg1         : 'assets/btn_read_now.png',
            btnImg2         : 'assets/btn_read_now.png',
            winBubbleImg1   : 'assets/win_bubble.png',
            winBubbleImg2   : 'assets/win_bubble2.png',
            link1           : 'https://honeytoon.com/comic/teach-me-first/1',
            link2           : 'https://honeytoon.com/comic-video/teach-me-first?n=1'
        };

        let state = 'SPLASH';

        const gameContainer     = document.getElementById('game-container');
        const splashTrigger     = document.getElementById('splash-trigger');
        const girlVideo         = document.getElementById('girl-video');
        const scratchZone       = document.getElementById('scratch-zone');
        const canvas            = document.getElementById('scratch-canvas');
        const ctx               = canvas.getContext('2d', { willReadFrequently: true });

        const tapToStartPng     = document.getElementById('tap-to-start-png');
        const scratchToClaimPng = document.getElementById('scratch-to-claim-png');
        const handPointer       = document.getElementById('hand-pointer');

        const featherContainer  = document.getElementById('feather-container');
        const feather           = document.getElementById('feather');

        const bgSound           = document.getElementById('bg-sound');
        const bgMusic           = document.getElementById('bg-music');
        const scratchSound      = document.getElementById('scratch-sound');
        const winSound          = document.getElementById('win-sound');

        const endCard           = document.getElementById('end-card');
        const winBubble         = document.getElementById('win-bubble');
        const ctaLink           = document.getElementById('cta-link');
        const ctaButton         = document.getElementById('cta-button');
        const timerLabel        = document.getElementById('timer');

        const musicToggle       = document.getElementById('music-toggle');
        const iconSoundOn       = document.getElementById('icon-sound-on');
        const iconSoundOff      = document.getElementById('icon-sound-off');
        const duarBlur          = document.getElementById('video-overlay-img');

        const pCanvas           = document.getElementById('particle-canvas');
        const pCtx              = pCanvas.getContext('2d');

        let isMusicMuted = false;
        let isDrawing    = false;
        let lastX, lastY;
        let isScratchSoundPlaying = false;
        let particles = [];
        let shatterTriggered = false;

        bgSound.muted     = true;
        bgMusic.muted     = true;
        scratchSound.muted = true;
        winSound.muted    = true;

        musicToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            isMusicMuted = !isMusicMuted;

            bgMusic.muted      = isMusicMuted;
            bgSound.muted      = isMusicMuted;
            scratchSound.muted = isMusicMuted;
            winSound.muted     = isMusicMuted;

            musicToggle.classList.toggle('muted', isMusicMuted);
            iconSoundOn.style.display  = isMusicMuted ? 'none'  : 'block';
            iconSoundOff.style.display = isMusicMuted ? 'block' : 'none';
        });

        let cardTexture = new Image();
        cardTexture.src = 'assets/gold_rectangle.png';
        cardTexture.onload = init;

        function init() {
            resizeCanvas();

            bgMusic.volume      = config.musicVolume;
            scratchSound.volume = config.scratchVolume;
            winSound.volume     = config.winVolume;
            girlVideo.playbackRate = config.videoSpeed;

            ctaLink.href = config.link1;

            splashTrigger.addEventListener('mousedown',  handleFullScreenStart);
            splashTrigger.addEventListener('touchstart', handleFullScreenStart, { passive: false });

            gameContainer.addEventListener('mousedown',  handleScratchStart);
            gameContainer.addEventListener('touchstart', handleScratchStart, { passive: false });

            window.addEventListener('mousemove',  handleMove);
            window.addEventListener('touchmove',  handleMove, { passive: false });
            window.addEventListener('mouseup',    handleEnd);
            window.addEventListener('touchend',   handleEnd);

            window.addEventListener('resize', onResize);
        }

        function resizeCanvas() {
            const rect = scratchZone.getBoundingClientRect();
            canvas.width  = rect.width;
            canvas.height = rect.height;
            ctx.drawImage(cardTexture, 0, 0, canvas.width, canvas.height);
        }

        function onResize() {
            if (state === 'WIN') return;
            resizeCanvas();
            const gcRect = gameContainer.getBoundingClientRect();
            pCanvas.width  = gcRect.width;
            pCanvas.height = gcRect.height;
        }

        
        function getRelativeCoords(e) {
            const gcRect  = gameContainer.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x : clientX - gcRect.left,
                y : clientY - gcRect.top,
                clientX,
                clientY
            };
        }

        function unlockAudioContext() {
            try {
                const ac  = new (window.AudioContext || window.webkitAudioContext)();
                const buf = ac.createBuffer(1, 1, 22050);
                const src = ac.createBufferSource();
                src.buffer = buf;
                src.connect(ac.destination);
                src.start(0);
                if (ac.state === 'suspended') ac.resume().catch(() => {});
            } catch (err) {}
        }

        function tryPlay(audio) {
            audio.play().catch(() => {
                setTimeout(() => audio.play().catch(() => {}), 300);
            });
        }

        function handleFullScreenStart(e) {
            if (state !== 'SPLASH') return;
            e.preventDefault();

            unlockAudioContext();

            bgSound.muted = true;
            bgMusic.muted = true;

            bgSound.play().then(() => { bgSound.muted = isMusicMuted; })
                          .catch(() => setTimeout(() => bgSound.play().then(() => { bgSound.muted = isMusicMuted; }).catch(() => {}), 300));

            bgMusic.play().then(() => { bgMusic.muted = isMusicMuted; })
                          .catch(() => setTimeout(() => bgMusic.play().then(() => { bgMusic.muted = isMusicMuted; }).catch(() => {}), 300));

            splashTrigger.remove();
            startScratchPhase();
        }

        function startScratchPhase() {
            state = 'SCRATCH';

            girlVideo.style.filter = 'blur(0px)';
            girlVideo.play().catch(() => {});

            tapToStartPng.style.display     = 'none';
            handPointer.style.display       = 'none';
            scratchToClaimPng.style.display = 'block';
            featherContainer.style.display  = 'flex';
        }

        function handleScratchStart(e) {
            if (state !== 'SCRATCH') return;

            const canvasRect = canvas.getBoundingClientRect();
            const clientX    = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY    = e.touches ? e.touches[0].clientY : e.clientY;

            // Починаємо скретч тільки якщо клік/тап потрапив у canvas
            if (clientX >= canvasRect.left && clientX <= canvasRect.right &&
                clientY >= canvasRect.top  && clientY <= canvasRect.bottom) {

                isDrawing = true;

                feather.classList.remove('feather-idle-animation');
                feather.classList.add('feather-drawing-animation');
                featherContainer.style.transition = 'none';

                updatePos(e);
            }
        }

        function updatePos(e) {
            const canvasRect = canvas.getBoundingClientRect();
            const clientX    = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY    = e.touches ? e.touches[0].clientY : e.clientY;
            lastX = clientX - canvasRect.left;
            lastY = clientY - canvasRect.top;

            const rel = getRelativeCoords(e);
            moveFeather(rel.x, rel.y);
        }

        function handleMove(e) {
            if (state !== 'SCRATCH' || !isDrawing) return;
            e.preventDefault();

            const canvasRect = canvas.getBoundingClientRect();
            const clientX    = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY    = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - canvasRect.left;
            const y = clientY - canvasRect.top;

            const rel = getRelativeCoords(e);
            moveFeather(rel.x, rel.y);

            if (!isScratchSoundPlaying && !isMusicMuted) {
                scratchSound.muted = false;
                tryPlay(scratchSound);
                isScratchSoundPlaying = true;
            }

            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = config.brushSize;
            ctx.lineCap   = 'round';
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();

            lastX = x;
            lastY = y;

            checkProgress();
        }

        function handleEnd() {
            if (state !== 'SCRATCH') return;

            if (isScratchSoundPlaying) {
                scratchSound.pause();
                isScratchSoundPlaying = false;
            }

            if (isDrawing) {
                isDrawing = false;

                featherContainer.style.transition = 'top 0.4s ease, left 0.4s ease';
                featherContainer.style.top  = '73%';
                featherContainer.style.left = '50%';

                feather.classList.remove('feather-drawing-animation');
                feather.classList.add('feather-idle-animation');
            }
        }

        function moveFeather(relX, relY) {
            featherContainer.style.display = 'flex';
            featherContainer.style.left    = relX + 'px';
            featherContainer.style.top     = relY + 'px';
        }

        
        function checkProgress() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels    = imageData.data;
            let clear = 0;

            for (let i = 3; i < pixels.length; i += 40) {
                if (pixels[i] === 0) clear++;
            }

            const percent = (clear / (pixels.length / 40)) * 100;

            if (!shatterTriggered && percent > config.requiredPercent) {
                shatterTriggered = true;
                triggerShatter();
            }
        }


        function triggerShatter() {
            if (state === 'WIN') return;
            state = 'WIN';

            isDrawing = false;
            featherContainer.style.display = 'none';
            scratchSound.pause();
            isScratchSoundPlaying = false;

            document.getElementById('game-header').style.display = 'none';
            scratchToClaimPng.style.display = 'none';
            duarBlur.style.display = 'none';
            canvas.style.display = 'none';

            if (!isMusicMuted) {
                winSound.muted = false;
                tryPlay(winSound);
            }

            // Знімок поточного стану canvas для анімації розбиття
            const snapshot = document.createElement('canvas');
            snapshot.width  = canvas.width;
            snapshot.height = canvas.height;
            const sCtx = snapshot.getContext('2d');
            sCtx.drawImage(canvas, 0, 0);

            const gameRect = gameContainer.getBoundingClientRect();
            const zoneRect = scratchZone.getBoundingClientRect();
            const zoneLeft = zoneRect.left  - gameRect.left;
            const zoneTop  = zoneRect.top   - gameRect.top;
            const zoneW    = zoneRect.width;
            const zoneH    = zoneRect.height;

            const COLS = 8, ROWS = 4;
            const tw   = zoneW / COLS;
            const th   = zoneH / ROWS;

            pCanvas.width  = gameRect.width;
            pCanvas.height = gameRect.height;
            pCanvas.style.zIndex = 40;

            const pieces = [];

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const pc = document.createElement('canvas');
                    pc.width  = tw;
                    pc.height = th;
                    const pCtxLocal = pc.getContext('2d');
                    pCtxLocal.drawImage(
                        snapshot,
                        c * (canvas.width  / COLS), r * (canvas.height / ROWS),
                        canvas.width  / COLS,        canvas.height / ROWS,
                        0, 0, tw, th
                    );

                    const startX = zoneLeft + c * tw + tw / 2;
                    const startY = zoneTop  + r * th + th / 2;
                    const cx     = zoneLeft + zoneW / 2;
                    const cy     = zoneTop  + zoneH / 2;
                    const dx     = startX - cx;
                    const dy     = startY - cy;
                    const dist   = Math.sqrt(dx * dx + dy * dy) || 1;
                    const speed  = 6 + Math.random() * 10;

                    pieces.push({
                        canvas : pc,
                        x      : startX,
                        y      : startY,
                        vx     : (dx / dist) * speed + (Math.random() - 0.5) * 4,
                        vy     : (dy / dist) * speed - Math.random() * 8,
                        rot    : 0,
                        vrot   : (Math.random() - 0.5) * 0.25,
                        alpha  : 1,
                        w      : tw,
                        h      : th,
                    });

                    const goldColors = ['#FFD700','#FFC200','#FFAA00','#FFF176','#FFE066'];
                    for (let k = 0; k < 5; k++) {
                        const angle = Math.random() * Math.PI * 2;
                        const spd   = 3 + Math.random() * 7;
                        particles.push({
                            x     : startX,
                            y     : startY,
                            vx    : Math.cos(angle) * spd,
                            vy    : Math.sin(angle) * spd - 2,
                            size  : Math.random() * 3 + 1.5,
                            color : goldColors[Math.floor(Math.random() * goldColors.length)],
                            alpha : 1,
                            type  : 'spark'
                        });
                    }
                }
            }

            const confettiColors = ['#FF5252','#FF4081','#7C4DFF','#40C4FF','#69F0AE','#FFFF00'];
            for (let i = 0; i < 70; i++) {
                particles.push({
                    x     : zoneLeft + Math.random() * zoneW,
                    y     : zoneTop  + Math.random() * zoneH,
                    vx    : (Math.random() - 0.5) * 14,
                    vy    : (Math.random() - 0.5) * 14 - 5,
                    size  : Math.random() * 5 + 2,
                    color : confettiColors[Math.floor(Math.random() * confettiColors.length)],
                    alpha : 1,
                    type  : 'confetti'
                });
            }

            let startTime = null;
            const DURATION = 350;

            function animateShatter(ts) {
                if (!startTime) startTime = ts;
                const elapsed  = ts - startTime;
                const progress = Math.min(elapsed / DURATION, 1);

                pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

                pieces.forEach(p => {
                    p.x    += p.vx;
                    p.y    += p.vy;
                    p.vy   += 0.45;
                    p.vx   *= 0.98;
                    p.rot  += p.vrot;
                    p.alpha = Math.max(0, 1 - progress * 1.4);

                    pCtx.save();
                    pCtx.globalAlpha = p.alpha;
                    pCtx.translate(p.x, p.y);
                    pCtx.rotate(p.rot);
                    pCtx.drawImage(p.canvas, -p.w / 2, -p.h / 2, p.w, p.h);
                    pCtx.restore();
                });

                particles.forEach(p => {
                    p.x    += p.vx;
                    p.y    += p.vy;
                    p.vy   += 0.3;
                    p.vx   *= 0.97;
                    p.alpha = Math.max(0, p.alpha - 0.018);

                    if (p.alpha <= 0) return;
                    pCtx.save();
                    pCtx.globalAlpha = p.alpha;
                    pCtx.fillStyle   = p.color;
                    if (p.type === 'spark') {
                        pCtx.translate(p.x, p.y);
                        pCtx.rotate(Math.atan2(p.vy, p.vx));
                        pCtx.fillRect(-p.size * 2, -p.size * 0.5, p.size * 4, p.size);
                    } else {
                        pCtx.beginPath();
                        pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        pCtx.fill();
                    }
                    pCtx.restore();
                });

                if (elapsed < DURATION) {
                    requestAnimationFrame(animateShatter);
                } else {
                    pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
                    endCard.style.display = 'flex';
                    particles = [];
                    startParticles();
                    startTimer();
                }
            }

            requestAnimationFrame(animateShatter);
        }

        
        let timeLeft      = config.timerDuration;
        let isSecondState = false;

        function startTimer() {
            setInterval(() => {
                timeLeft--;
                if (timeLeft < 0) {
                    timeLeft      = config.timerDuration;
                    isSecondState = !isSecondState;

                    ctaButton.src = isSecondState ? config.btnImg2 : config.btnImg1;
                    winBubble.src = isSecondState ? config.winBubbleImg2 : config.winBubbleImg1;
                    ctaLink.href  = isSecondState ? config.link2 : config.link1;
                }
                const s = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                timerLabel.innerText = `Access expires in 00:${s}s`;
            }, 1000);
        }

        // ==========================================================
        //  КОНФЕТІ (end-card)
        // ==========================================================
        function startParticles() {
            const gcRect   = gameContainer.getBoundingClientRect();
            pCanvas.width  = gcRect.width;
            pCanvas.height = gcRect.height;
            pCanvas.style.zIndex = 25;

            for (let i = 0; i < 60; i++) {
                particles.push({
                    x     : pCanvas.width / 2,
                    y     : pCanvas.height / 2,
                    vx    : (Math.random() - 0.5) * 12,
                    vy    : (Math.random() - 0.5) * 12 - 4,
                    size  : Math.random() * 4 + 2,
                    color : `hsl(${Math.random() * 360}, 100%, 60%)`,
                    alpha : 1,
                    type  : 'confetti'
                });
            }
            requestAnimationFrame(updateParticles);
        }

        function updateParticles() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            particles.forEach(p => {
                p.x  += p.vx;
                p.y  += p.vy;
                p.vy += 0.25;
                pCtx.fillStyle = p.color;
                pCtx.beginPath();
                pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                pCtx.fill();
            });
            requestAnimationFrame(updateParticles);
        }
    </script>
